<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- The picture a weather break wears. Drawn for this repository; see MANIFEST.json.

         The station's own mark is IN the weather rather than beside it: the skull is what is inside
         the cloud, with the sun behind. The cloud is therefore drawn three times — the background
         colour to fill it, the mark clipped to its outline, and the ink stroke over the top — because
         the mark carries its own flat green field (#2ED88B, which this tile matches, so the join is
         invisible) and an unstroked cloud on a green tile would have no edge at all.

         `weather.png` beside this is what SHIPS, and it is this file rasterised:

             qlmanage -t -s 512 -o <somewhere> assets/art/breaks/weather.svg

         The mark is referenced by path rather than embedded so this file stays a few kilobytes; the
         path is `apps/ios`'s app icon, which is the largest copy of it in the tree at 1024px and the
         only one with no lettering. -->
    <defs>
        <!-- A `<g>` is not a permitted child of `<clipPath>`, so the transform sits on the path
             itself. It renders as an empty clip otherwise, which is a picture with no skull in it. -->
        <clipPath id="cloud">
            <path transform="translate(-146 -97) scale(1.28)" d="M176 396a74 74 0 0 1 8-147 104 104 0 0 1 196-30 66 66 0 0 1 8 177z"/>
        </clipPath>
    </defs>

    <rect width="512" height="512" fill="#2ED88B"/>

    <!-- The sun, first, so the cloud passes in front of it. -->
    <g stroke="#121514" stroke-width="16" stroke-linecap="round">
        <line x1="463.3" y1="191.7" x2="491.0" y2="203.2"/>
        <line x1="429.7" y1="225.3" x2="441.2" y2="253.0"/>
        <line x1="382.3" y1="225.3" x2="370.8" y2="253.0"/>
        <line x1="348.7" y1="191.7" x2="321.0" y2="203.2"/>
        <line x1="348.7" y1="144.3" x2="321.0" y2="132.8"/>
        <line x1="382.3" y1="110.7" x2="370.8" y2="83.0"/>
        <line x1="429.7" y1="110.7" x2="441.2" y2="83.0"/>
        <line x1="463.3" y1="144.3" x2="491.0" y2="132.8"/>
    </g>
    <circle cx="406" cy="168" r="54" fill="#121514"/>

    <!-- The cloud: its field, the mark inside it, then its edge. -->
    <path transform="translate(-146 -97) scale(1.28)" d="M176 396a74 74 0 0 1 8-147 104 104 0 0 1 196-30 66 66 0 0 1 8 177z" fill="#2ED88B"/>
    <image href="../../../apps/ios/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" x="133.2" y="184.1" width="234.5" height="234.5" clip-path="url(#cloud)"/>
    <path transform="translate(-146 -97) scale(1.28)" d="M176 396a74 74 0 0 1 8-147 104 104 0 0 1 196-30 66 66 0 0 1 8 177z" fill="none" stroke="#121514" stroke-width="20" stroke-linejoin="round"/>
</svg>
