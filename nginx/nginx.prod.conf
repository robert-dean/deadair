events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # API. In prod the API is the `app` container (root Dockerfile, PORT=3000).
        # NOTE: no `app` service exists in docker-compose.yml yet — the overlay
        # defines it. The API strips the /api prefix itself via apiPrefixMiddleware,
        # so pass the prefix through rather than rewriting it away.
        location /api/ {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE (the monitoring bus) lives under this prefix, so buffering has
            # to be off or events queue instead of arriving as they're emitted.
            proxy_buffering off;
            proxy_read_timeout 1h;
            client_max_body_size 64m;
        }

        include /etc/nginx/snippets/icecast.conf;

        # nginx serves the built SPA itself. The overlay bind-mounts
        # apps/web/dist here. Note the root Dockerfile ALSO stages that build
        # into the app image (WEB_DIST_DIR) for the standalone single-container
        # path; with nginx fronting, the app's spaMiddlewares never see a
        # request, so pick one owner for the SPA and keep it.
        root /srv/web;
        index index.html;

        # Vite emits content-hashed filenames under /assets, so they're
        # immutable; everything else falls through to the SPA history fallback.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
