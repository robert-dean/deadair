# Dev edge. Overlay on the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up nginx
#
# The API and Vite still run on the host (`pnpm dev`); this only adds the single
# public origin in front of them and icecast, so the SPA, the API and the stream
# all share http://localhost:8080 and there's no cross-origin cookie handling.
services:
    nginx:
        # The same version the production image runs, so the edge dev is tested
        # against is the edge that ships.
        image: nginx:1.30-alpine
        container_name: deadair-nginx
        restart: unless-stopped
        ports:
            - '127.0.0.1:8080:80'
        volumes:
            - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/snippets:/etc/nginx/snippets:ro
            # The HLS segments, served straight off the volume liquidsoap writes them to.
            # Read-only: nginx serves this directory and never produces it. The PLAYLISTS in
            # the same directory are proxied to the API instead, because a playlist request is
            # how an HLS listener is counted — see nginx/snippets/hls.conf.
            - ./.docvol/streamhls:/data/streamhls:ro
        # Reach the host-run API (:3333) and Vite (:3002).
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            icecast:
                condition: service_started
