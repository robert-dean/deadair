org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# Each module's R class carries only its own resources, so a dependency's ids are not silently
# in scope here.
android.nonTransitiveRClass=true

# AGP 9's new DSL is on by default and the standalone `org.jetbrains.kotlin.android` plugin
# cannot be applied alongside it — it casts the extension to a type the new DSL no longer
# produces, and the build fails at plugin application with a class-cast. So the app module uses
# AGP's BUILT-IN Kotlin, which is the default and is left alone here.
#
# The generated SDK beside it is a plain JVM module and still applies `org.jetbrains.kotlin.jvm`.
# The two are held to one Kotlin version by the `kotlin` entry in `gradle/libs.versions.toml`,
# which the app pins through `androidComponents`; they are separate modules, so nothing forces
# them to agree on its own.
