events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Docker's embedded DNS, re-resolved so a restarted upstream container's new
    # IP is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s;

    # Nothing is in front of this edge in dev, so this is empty and does nothing. It is here so
    # the two compose edges and the image's stay one shape; the reasoning is in nginx.prod.conf.
    include /etc/nginx/realip.d/*.conf;

    # The scheme the BROWSER used rather than the one this edge listens as. Dev is http both ways,
    # so this changes nothing here and exists so the two edges stay one shape; the reasoning is in
    # nginx/nginx.prod.conf.
    map $http_x_forwarded_proto $forwarded_scheme {
        default    $scheme;
        "~*^https"  https;
    }

    # Where the API is, for the HLS snippet. An upstream block rather than a literal in
    # the snippet, because this address is the one thing that genuinely differs between
    # this edge, the compose production edge and the single-container image.
    upstream hls_api {
        server host.docker.internal:3333;
    }

    server {
        listen 80;
        server_name _;

        # API. In dev both the API and Vite run on the HOST (`pnpm dev`), not as
        # compose services, so they're reached through host.docker.internal
        # (mapped to host-gateway in the compose overlay). 3333 is PORT in
        # apps/api/.env. The API mounts its ContractKit routers at the ROOT and
        # knows nothing about /api, so the prefix is stripped here: the trailing
        # slash on proxy_pass replaces the matched /api/ with /. This mirrors the
        # rewrite in apps/web/vite.config.ts, which is why the SPA works when it
        # talks to Vite directly but 404s through this edge without it.
        #
        # `^~` because the mount snippet below is a REGEX location, and a regex beats
        # an ordinary prefix. This modifier is what stops an API route whose path
        # happens to end in an audio extension being proxied to Icecast instead. See
        # nginx/snippets/icecast.conf.
        location ^~ /api/ {
            # ── Liveness, refused at the edge ──────────────────────────────────────
            #
            # Refused exactly as docker/nginx.conf refuses it, and the long reasoning lives
            # there. The REASON is a production one -- `/health` reports the commit the image
            # was built from, a build fingerprint anybody on the internet can read -- and it is
            # mirrored here so the two edges have one shape. A developer who wants liveness
            # asks the API directly on 3333, which is where it is; nothing in dev needs this
            # path through the edge, so leaving it open here would only mean prod refuses
            # something dev served and nobody finds out until deploy.
            #
            # An `if` rather than a `location =`: `^~` on this prefix stops nginx considering
            # regex locations at all, and an exact location is case-sensitive and slash-exact
            # while @koa/router is neither, so `/api/Health` and `/api/health/` both walked
            # past the exact form. `return` is safe inside `if`.
            #
            # 404 rather than 403, on the rule the station already follows for a rejected HLS
            # name: a caller trying it on learns nothing from being told they were caught.
            if ($uri ~* "^/api/health(check)?/*$") { return 404; }

            proxy_pass http://host.docker.internal:3333/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;

            # SSE (the monitoring bus) lives under this prefix, so buffering has
            # to be off or events queue instead of arriving as they're emitted.
            proxy_buffering off;
            proxy_read_timeout 1h;
            client_max_body_size 64m;
        }

        include /etc/nginx/snippets/icecast.conf;
        include /etc/nginx/snippets/hls.conf;

        # Everything else goes to the Vite dev server.
        location / {
            proxy_pass http://host.docker.internal:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;

            # Vite HMR is a websocket; without these it falls back to polling
            # or fails outright.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
    }
}
