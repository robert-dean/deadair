# The console's security headers. Included INSIDE each location that serves the console's own
# files (`/assets/` and the history fallback), never at server level, and that placement is the
# whole of the care this file needs.
#
# ── Why per location ───────────────────────────────────────────────────────────
# nginx's `add_header` does not merge down: a location with ANY add_header of its own drops every
# one set at server level. `/assets/` has its Cache-Control, so a server-level block here would
# have silently missed the console's entire JavaScript. And the other direction is worse: the
# mount, the HLS output and the TuneIn playlists are fetched by players and by other people's
# pages, and a server-level `frame-ancestors` or `nosniff` would have reached every one of those
# snippets that sets no header of its own. Nothing here is meant for them.
#
# The API's `/api/` is not a console location either and gets none of this. It answers JSON, audio
# and art to callers that are not the console, and its one HTML response (the OIDC callback's
# redirect page) carries an inline script this policy would refuse.
#
# ── The policy, measured against the built console ─────────────────────────────
# script-src 'self'      Vite emits module scripts and modulepreloads under /assets/, and nothing
#                        in the bundle evaluates strings or starts a worker. The one inline script
#                        `index.html` had is `public/theme.boot.js` now, for this line's sake.
# style-src 'unsafe-inline'  Mantine writes its CSS variables into a `<style>` element at runtime,
#                        React's `style={}` is an inline style attribute on half the console, and
#                        `index.html` paints the background in a `<style>` before any sheet loads.
#                        No nonce is possible from a static file, so this is the price of Mantine.
# img-src https: http:   Cover art is HOTLINKED from whichever provider found it until the cache
#                        pass holds the bytes (`artSrc` in apps/web/src/api/art.ts), so the hosts
#                        are every provider a plugin can name. `http:` because a Navidrome on the
#                        operator's own network is plain http, and a station opened over https
#                        refuses or upgrades that as mixed content whatever this says. `data:` is
#                        the authenticator QR code, which arrives as a data URL.
# font-src data:         Space Mono is self-hosted, and Vite inlines the smallest subsets.
# media-src blob:        Every preview is fetched through the SDK with the bearer and played from
#                        an object URL, because an `<audio src>` sends no Authorization header.
# connect-src 'self'     The SDK calls `/api` on this origin, and nothing in the console fetches
#                        another one.
# form-action 'self'     Every form is submitted by script. Signing in through an identity
#                        provider, connecting a plugin and approving an app over OAuth all leave
#                        with `window.location.assign`, which form-action does not govern, so
#                        none of their destinations has to be listed here.
# frame-ancestors 'self' Clickjacking. X-Frame-Options says the same for anything too old to read
#                        CSP; where both are understood, frame-ancestors wins.
#
# Referrer-Policy is `same-origin`, stricter than the browser's default, because nothing reads a
# referrer: the API never looks at one, and the only cross-origin requests the console makes are
# art hotlinks and navigations to an identity provider or an app's redirect, none of which should
# learn which console page sent them. Same-origin requests keep it, and keep their `Origin`, which
# is what the API's CORS check reads.
#
# nginx/nginx.dev.conf does not include this file, because Vite's dev server injects an inline
# React Refresh preamble this policy refuses. It restates these headers with that one difference.
# A change here is a change there.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
