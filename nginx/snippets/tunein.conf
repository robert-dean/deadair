# The tune-in files: `/listen.pls` and `/listen.m3u`, at the root of the station's address.
#
# For the players that take a playlist file rather than a stream address: a hardware radio, a car
# receiver, most desktop players. The API builds both from the station's public address and its
# mounts, so they are proxied there with the path unchanged, through the same upstream the HLS
# playlists use. Without this they fell through to the console's `try_files` and answered its HTML
# with a 200, which a player reads as a playlist with nothing in it.
#
# Exact paths rather than a pattern: `.m3u` must not start catching anything near `.m3u8`, which
# `hls.conf` redirects, and nothing else at the root is meant to reach the API this way.
location ~ ^/listen\.(pls|m3u)$ {
    proxy_pass http://hls_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
}
