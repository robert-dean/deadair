            operationId: moveOrderItem
            summary: 'Move a running order item'
            description: 'Moves an item. A position already handed to the player is refused rather than clamped'
            parameters:
                - name: itemId
                  in: path
                  required: true
                  schema:
                      type: string
                      minLength: 1
                      maxLength: 100
            requestBody:
                required: true
