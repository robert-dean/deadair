<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- The picture a weather break wears. Drawn for this repository; see MANIFEST.json.

         The station's own mark is IN the weather rather than beside it: the skull is what is inside
         the cloud, with the sun behind it. `news.svg` makes the same move with the photograph on its
         front page, which is what keeps the two a set.

         `weather.png` beside this is what SHIPS, and it is this file rasterised:

             qlmanage -t -s 512 -o <somewhere> assets/art/breaks/weather.svg

         The mark is referenced by path rather than embedded so this file stays a few kilobytes. The
         path is `apps/ios`'s app icon, which is the largest copy of it in the tree at 1024px and the
         only one carrying no lettering; it brings its own flat green field (#2ED88B), which is why
         this tile is that green rather than the console's phosphor and why the clipped edge is
         invisible. -->
    <defs>
        <!-- The cloud is a UNION of three circles over a flat base rather than one path of arcs,
             because an arc path of this shape is written wrong far more easily than it is written
             right, and did not survive its first reading: what it drew was a lozenge.

             It is OUTLINED by drawing that union twice — once filled and stroked in ink, which puts
             an edge on the outside of every shape, and once filled flat, which covers the edges that
             fell inside it. A third pass stroking the shapes again is the obvious-looking way to do
             it and draws every internal edge straight back in, which is what it did the first time.

             A `<g>` is not a permitted child of `<clipPath>`, so the shapes are repeated here rather
             than referenced. Wrapped in one, the clip is empty and this renders as a cloud with no
             skull in it. -->
        <clipPath id="cloud">
            <circle cx="170" cy="292" r="78"/>
            <circle cx="256" cy="232" r="106"/>
            <circle cx="346" cy="292" r="78"/>
            <rect x="92" y="290" width="328" height="110" rx="55"/>
        </clipPath>
    </defs>

    <rect width="512" height="512" fill="#2ED88B"/>

    <!-- The sun, first, so the cloud passes in front of it. -->
    <g stroke="#121514" stroke-width="16" stroke-linecap="round">
        <line x1="462.4" y1="151.0" x2="488.3" y2="161.7"/>
        <line x1="431.0" y1="182.4" x2="441.7" y2="208.3"/>
        <line x1="387.0" y1="182.4" x2="376.3" y2="208.3"/>
        <line x1="355.6" y1="151.0" x2="329.7" y2="161.7"/>
        <line x1="355.6" y1="107.0" x2="329.7" y2="96.3"/>
        <line x1="387.0" y1="75.6" x2="376.3" y2="49.7"/>
        <line x1="431.0" y1="75.6" x2="441.7" y2="49.7"/>
        <line x1="462.4" y1="107.0" x2="488.3" y2="96.3"/>
    </g>
    <circle cx="409" cy="129" r="46" fill="#121514"/>

    <!-- The cloud: ink pass for the edge, flat pass for the field, then the mark inside it. -->
    <g fill="#121514" stroke="#121514" stroke-width="22" stroke-linejoin="round">
        <circle cx="170" cy="292" r="78"/>
        <circle cx="256" cy="232" r="106"/>
        <circle cx="346" cy="292" r="78"/>
        <rect x="92" y="290" width="328" height="110" rx="55"/>
    </g>
    <g fill="#2ED88B">
        <circle cx="170" cy="292" r="78"/>
        <circle cx="256" cy="232" r="106"/>
        <circle cx="346" cy="292" r="78"/>
        <rect x="92" y="290" width="328" height="110" rx="55"/>
    </g>
    <image href="../../../apps/ios/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" x="119.8" y="147.5" width="272.2" height="272.2" clip-path="url(#cloud)"/>
</svg>
