<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- The picture a weather break wears. Drawn for this repository; see MANIFEST.json.

         Phosphor (#2FD98C) and carbon (#121514) are the console's own accent and ink, so a
         break sits beside the station's logo rather than beside a stock photograph. Flat and
         unlettered on purpose: this is drawn at 512 and seen at 28 in a running-order row, at 88
         on the desk, and at whatever a hardware player's artwork slot happens to be. -->
    <rect width="512" height="512" fill="#2FD98C"/>
    <g fill="#121514">
        <!-- The sun, behind and up-left, so the cloud reads as being in front of it. -->
        <g>
            <circle cx="196" cy="186" r="70"/>
            <g stroke="#121514" stroke-width="22" stroke-linecap="round">
                <line x1="196" y1="66" x2="196" y2="92"/>
                <line x1="196" y1="280" x2="196" y2="306"/>
                <line x1="76" y1="186" x2="102" y2="186"/>
                <line x1="290" y1="186" x2="316" y2="186"/>
                <line x1="111" y1="101" x2="129" y2="119"/>
                <line x1="263" y1="253" x2="281" y2="271"/>
                <line x1="111" y1="271" x2="129" y2="253"/>
                <line x1="263" y1="119" x2="281" y2="101"/>
            </g>
        </g>
        <!-- The cloud, stroked in the background colour so its edge separates it from the sun
             behind it. Both shapes are the same ink, so without that stroke they merge into one
             blob at row size. -->
        <path d="M176 396a74 74 0 0 1 8-147 104 104 0 0 1 196-30 66 66 0 0 1 8 177z"
              stroke="#2FD98C" stroke-width="24" stroke-linejoin="round"/>
    </g>
</svg>
