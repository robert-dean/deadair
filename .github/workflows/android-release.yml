# Publishing the Android listener to Google Play.
#
# Deliberately `workflow_dispatch` and NOT a push trigger, which is the one real decision in this
# file. `release.yml` publishes Docker images on every push to main that changes them, and that is
# right for images: a tag is overwritten and nobody downstream is counting them. A Play upload is not
# like that. Every upload burns a version code permanently, appears in the console's release history
# for good, and on a track with real testers reaches their phones. `versionCode` is the commit count,
# so a push trigger would technically work and would also ship a build for every README typo.
#
# So this runs when somebody asks for it. Adding `on: push: tags: ['v*']` later is one line, once
# the manual path has been walked enough times to trust it.

name: Android release

on:
    workflow_dispatch:
        inputs:
            mode:
                description: Build and upload a new bundle, or move one already in Play
                type: choice
                default: publish
                options:
                    - publish
                    - promote
            track:
                description: Track to publish or promote TO
                type: choice
                default: internal
                options:
                    - internal
                    - alpha
                    - beta
                    - production
            # `inProgress` is a staged rollout and takes `user_fraction`. `halted` stops one where it
            # stands and is promote-only, with the same track on both sides; so is widening one,
            # which is promote again with a larger fraction, and finishing it, which is `completed`.
            status:
                description: Release status on that track
                type: choice
                default: completed
                options:
                    - completed
                    - draft
                    - inProgress
                    - halted
            user_fraction:
                description: 'inProgress only: share of users to reach, above 0 and below 1 (0.2 is 20%)'
                type: string
                default: ''
            from_track:
                description: 'promote only: track to take the build FROM'
                type: choice
                default: internal
                options:
                    - internal
                    - alpha
                    - beta
                    - production
            version_code:
                description: 'promote only: which build. Blank takes whatever is on the source track'
                type: string
                default: ''

concurrency:
    group: android-release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    publish:
        if: inputs.mode == 'publish'
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            # Before anything is built, so a mistyped fraction costs seconds rather than a ten-minute
            # build that then fails to upload. The promote job leaves this to the script.
            - name: Check the rollout
              env:
                  STATUS: ${{ inputs.status }}
                  FRACTION: ${{ inputs.user_fraction }}
              run: |
                  if [ "$STATUS" = halted ]; then
                      echo "::error::halted stops a rollout that is already in Play. Run promote, with the same track on both sides."
                      exit 1
                  fi
                  if [ "$STATUS" = inProgress ]; then
                      if ! awk -v f="$FRACTION" 'BEGIN { exit !(f ~ /^0?\.[0-9]+$/ && f > 0 && f < 1) }'; then
                          echo "::error::inProgress needs a user_fraction above 0 and below 1, such as 0.2."
                          exit 1
                      fi
                  elif [ -n "$FRACTION" ]; then
                      echo "::error::user_fraction applies only to inProgress. $STATUS reaches everybody on the track."
                      exit 1
                  fi

            # `fetch-depth: 0` rather than the shallow default, and it is load-bearing: `versionCode`
            # is `git rev-list --count HEAD`, and a shallow checkout answers 1. Publishing from one
            # would upload version code 1 and every later release would be rejected as lower.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Accept the SDK licences
              run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

            # The key is written to the runner's own Gradle home rather than passed as `-P` flags,
            # so no secret ever lands on a command line where `ps` could read it. The build reads
            # these four exactly as it reads them on a laptop; nothing about the signing config is
            # CI-specific.
            - name: Install the upload key
              env:
                  KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
              run: |
                  if [ -z "$KEYSTORE_BASE64" ]; then
                      echo "::error::UPLOAD_KEYSTORE_BASE64 is not set. See apps/android/README.md."
                      exit 1
                  fi
                  mkdir -p "$HOME/.gradle" "$HOME/keys"
                  printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/keys/upload.jks"
                  chmod 600 "$HOME/keys/upload.jks"
                  {
                      printf 'deadair.upload.keystore=%s\n' "$HOME/keys/upload.jks"
                      printf 'deadair.upload.keystorePassword=%s\n' "$KEYSTORE_PASSWORD"
                      printf 'deadair.upload.keyAlias=%s\n' "$KEY_ALIAS"
                      printf 'deadair.upload.keyPassword=%s\n' "$KEY_PASSWORD"
                  } >> "$HOME/.gradle/gradle.properties"
                  chmod 600 "$HOME/.gradle/gradle.properties"

            # The same checks `build.yml` runs, because a build worth publishing is one that passed
            # them. This workflow does not call that one: it needs a deep checkout and a signing key,
            # and neither belongs in the job every pull request runs.
            - name: Test and lint
              working-directory: apps/android
              run: ./gradlew --no-daemon :sdk:build :app:testDebugUnitTest :app:lintDebug

            - name: Build the signed bundle
              working-directory: apps/android
              run: ./gradlew --no-daemon :app:bundleRelease

            # Refuses to publish an unsigned artifact. Without the key the build SUCCEEDS and emits
            # an unsigned bundle by design — that is what lets pull requests build the release path
            # at all — so the check that a key was actually applied has to be explicit here.
            - name: Verify it is signed
              working-directory: apps/android
              run: |
                  AAB=app/build/outputs/bundle/release/app-release.aab
                  if ! jarsigner -verify "$AAB" | grep -q 'jar verified'; then
                      echo "::error::The bundle is not signed. The upload key did not reach the build."
                      exit 1
                  fi
                  echo "Signed. Version code: $(git rev-list --count HEAD)"

            - name: Upload to Play
              uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
                  packageName: com.maroonedsoftware.deadair
                  releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
                  # R8 renames everything, so without this a crash in the console is unreadable.
                  mappingFile: apps/android/app/build/outputs/mapping/release/mapping.txt
                  # One `whatsnew-<locale>` file per language, 500 characters each. Whatever the
                  # file says at this commit is what testers and listeners read, so it is edited in
                  # the commit before a publish rather than typed into the console after one.
                  # Promotion carries the notes with the build.
                  whatsNewDirectory: apps/android/play/whatsnew
                  # `tracks`, plural: the singular is deprecated and the action warns on it.
                  tracks: ${{ inputs.track }}
                  status: ${{ inputs.status }}
                  # Empty unless staged; the action reads an empty input as unset.
                  userFraction: ${{ inputs.status == 'inProgress' && inputs.user_fraction || '' }}

    # Promotion touches no artifact, so this job is handed no signing key and builds nothing. It
    # needs the checkout only for the script, and not even a deep one: there is no version code to
    # derive here, because the build being moved already has one.
    promote:
        if: inputs.mode == 'promote'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - name: Install the API client
              run: pip install --quiet google-auth requests

            - name: Promote
              env:
                  PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
                  USER_FRACTION: ${{ inputs.user_fraction }}
              run: |
                  python3 apps/android/tools/promote-play-release.py \
                      --package com.maroonedsoftware.deadair \
                      --from-track '${{ inputs.from_track }}' \
                      --to-track '${{ inputs.track }}' \
                      --status '${{ inputs.status }}' \
                      ${{ inputs.version_code != '' && format('--version-code {0}', inputs.version_code) || '' }} \
                      ${USER_FRACTION:+--user-fraction "$USER_FRACTION"}
