                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: 'Successful response'
                    content:
                        'application/json':
                            schema:
                                '$ref': '#/components/schemas/SegmentList'
                '404':
                    description: 'Not found'
                '409':
                    description: Conflict
    '/segments/{id}/audio':
        get:
            operationId: getSegmentAudio
            summary: 'Get segment audio'
            description: 'The audio of one segment'
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            security: []
            responses:
                '200':
                    description: 'Successful response'
                    content:
                        'audio/mpeg':
                            schema:
                                type: string
                                format: binary
                        'audio/wav':
                            schema:
                                type: string
                                format: binary
                        'audio/ogg':
                            schema:
                                type: string
                                format: binary
                        'audio/flac':
                            schema:
                                type: string
                                format: binary
                        'audio/mp4':
                            schema:
                                type: string
                                format: binary
                    headers:
