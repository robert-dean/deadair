# The HLS output — identical in dev and prod, apart from where the files are.
#
# ── Why this is split in two ───────────────────────────────────────────────────
# The SEGMENTS are served from disk by nginx, which is what nginx is for and keeps
# the station's audio out of Node entirely. The PLAYLISTS are proxied to the API,
# and that is not an accident of layering: an HLS player holds no connection open,
# so nothing can be asked how many people are listening. What a live player does
# instead is re-fetch the media playlist every target duration, because that is the
# only way to learn about the next segment — so a playlist request is a per-client
# heartbeat that arrives on its own, and the app counts it.
#
# That count is load-bearing. With `playout.airMode: audience` a listener nobody
# counts is a station that goes quiet with somebody listening to it.
#
# The two alternatives were both rejected. `auth_request` here would put the API in
# the path of every listener's own connection, which is exactly what
# `<authentication type="url">` did before it was removed from icecast.xml. Reading
# entries out of this access log is the "zero and unknown are the same number"
# failure the audience gate exists to refuse.
#
# ── Why the relative URIs resolve ──────────────────────────────────────────────
# Liquidsoap writes segment URIs into the playlist as bare filenames. Serving the
# playlist from `/hls/live.m3u8` means a player resolves `live_aac_00042.ts`
# against `/hls/`, which lands on the location below. So nothing rewrites anything:
# both halves live under one prefix and the split is invisible to the player.
#
# A regex location beats a prefix location in nginx, which is what makes the two
# rules below work in this order regardless of how they are written.
#
# ── What each edge has to declare before including this ───────────────────────
# `upstream hls_api` — where the API is, which is the one thing that genuinely
# differs between the compose edges and the single-container image.
#
# And the segments have to be at `/data/streamhls`. That is where they really are
# in the production image; the dev nginx mounts the same volume at the same path
# purely so this file can state it once. A second copy of the split below, kept in
# step by hand across three configs, is worth more than the oddity of a `/data`
# path in a container that has no other use for one.

# A tidy public URL, so the HLS output can be handed out beside the mounts:
# `/live.m3u8` alongside `/live.mp3` and `/live.opus`, rather than a path with a
# directory in it.
#
# A REDIRECT rather than serving it here, because a player resolves a playlist's
# relative URIs against the URL it ENDED UP at. Liquidsoap writes segment URIs as bare
# filenames, so a player served the master playlist at the root would resolve
# `aac_52.aac` against `/` — where the Icecast mount regex claims it, since the segments
# are named `.aac` and `.mp3`, and answers 404 for a mount that does not exist. HLS would
# look like it was working right up to the point of playing nothing. After a redirect the
# player is at `/hls/`, so every relative URI lands where the files are.
#
# Matched by SHAPE rather than by name, on the same rule as the mount locations: any
# single-segment `.m3u8` at the root. So `/aac.m3u8` works too, for a player being pointed
# at the variant deliberately rather than through the master.
#
# 302 and not 301: a permanent redirect is cached by clients past the point where anyone
# could change their mind about this URL.
location ~ ^/([^/]+\.m3u8)$ {
    # RELATIVE, which is the whole reason this line exists. Left to itself nginx builds an
    # absolute `Location` out of `$host` and its own listening scheme, and drops the port:
    # a listener on `:8080` is sent to `http://127.0.0.1/hls/live.m3u8` on port 80, and one
    # arriving over the public HTTPS edge is sent to this container's own idea of where it
    # is. A relative Location is resolved by the client against the URL it actually asked
    # for, which is right in both cases and needs nginx to know nothing about either.
    absolute_redirect off;

    # ON THE REDIRECT ITSELF, which looks redundant and is not. A cross-origin fetch applies
    # the CORS check to EVERY response in a redirect chain, so a 302 with no
    # `Access-Control-Allow-Origin` fails before the browser will follow it. Without this a
    # JavaScript player handed `/live.m3u8` — the tidy URL this station hands OUT — is refused
    # here, while the same player handed `/hls/live.m3u8` gets through, which reads as one of
    # the two URLs being wrong rather than as a missing header.
    add_header Access-Control-Allow-Origin "*" always;

    return 302 /hls/$1;
}

# The playlists. To the API, which serves them off the same volume and counts the
# request while it does.
location ~ ^/hls/.+\.m3u8$ {
    proxy_pass http://hls_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;

    # A live playlist is rewritten every segment and is worthless a moment later.
    # The app says so on the response too; this is the belt to that's braces, and
    # covers a proxy between here and the listener that ignores one of them.
    proxy_buffering off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# Liquidsoap's own segment-numbering state, which lives in this directory because that is the
# one path both deployments have and can write. It is not audio and nobody should be able to
# fetch it, so it is refused before the location below can serve it. An exact-match location is
# checked ahead of every prefix and regex, which is what makes one line enough.
location = /hls/state.json {
    return 404;
}

# The segments. Straight off the volume liquidsoap writes them to.
#
# A PLAIN prefix, and `^~` would be a bug here rather than the belt-and-braces it is on `/api/`.
# That modifier means "match this and do not consider regex locations at all", so it would take
# the playlists too — which are served from this same directory, so they would answer 200 off the
# disk and look perfectly correct. What would be missing is the only thing the split exists for:
# the request never reaches the API, so no HLS listener is ever counted, and an audience-gated
# station goes quiet with people listening. Measured here before it shipped: the giveaway was two
# `Cache-Control` headers on a playlist, one of them `immutable`.
location /hls/ {
    alias /data/streamhls/;

    # nginx's shipped mime.types knows `.m3u8` and not the segment extensions, so without this a
    # segment is served as `application/octet-stream`. Most players take the playlist's word for
    # what a segment is, but the ones that sniff the response instead are exactly the hardware
    # players this output exists to reach.
    types {
        audio/aac aac;
        audio/mpeg mp3;
        video/mp2t ts;
        application/vnd.apple.mpegurl m3u8;
    }
    default_type application/octet-stream;

    # A segment never changes once written — its name carries its sequence number —
    # so it can be held for as long as it exists. It is deleted a few segments after
    # it leaves the playlist, which is the real lifetime.
    expires 1h;
    add_header Cache-Control "public, max-age=3600, immutable" always;

    # The stream is a BROADCAST, so any page may fetch it. The playlists get the same header
    # from the app (`hls.cors.middleware`) and the segments have to get it here, because they
    # never reach the app at all. Both halves or neither: a JavaScript player that is allowed
    # to read the playlist and then refused every segment fails one window later, which is
    # further from the cause than failing outright.
    #
    # `*` and no credentials, which is what this endpoint IS: an anonymous GET for a file,
    # carrying no session and never setting one. That is a different policy from the console's
    # credentialed allowlist, and deliberately so — see the middleware for why one list cannot
    # serve both.
    add_header Access-Control-Allow-Origin "*" always;

    # A player asking for a segment that has rolled off is an ordinary event on a
    # slow connection, not a fault worth an error page.
    try_files $uri =404;
}
