# Building the desktop listener and desk as something somebody can download.
#
# Deliberately `workflow_dispatch` and NOT a push trigger, for the same reason `android-release.yml`
# takes no branch push: `release.yml` publishes Docker images on every push to main that changes
# them, which is right for images because a tag is overwritten and nobody downstream counts them.
# A GitHub release is not like that. It is a permanent entry with a version somebody may already
# have downloaded, and a push trigger would cut one for every README typo.
#
# The tag it cuts is `desktop-v<version>`, NOT `v<version>`. The bare `v*` namespace belongs to the
# station's own releases, which are what an operator means by "a deadair release"; a macOS listener
# sharing it would put two unrelated things in one numbered sequence and make `v0.1.0` ambiguous.
#
# The artifact is UNSIGNED. macOS will refuse it on a first launch until somebody right-clicks and
# chooses Open, which is stated in the release notes rather than left to be discovered. Signing needs
# an Apple Developer ID and a decision about paying for one; the steps below are shaped so that
# adding it later is a secret and one extra step rather than a rewrite.

name: Desktop release

on:
    workflow_dispatch:
        inputs:
            draft:
                description: Create the release as a draft rather than publishing it
                type: boolean
                default: true

permissions:
    contents: write

jobs:
    release:
        # macOS, and not a choice: the player is AVFoundation behind a shim that only clang on a Mac
        # can build, and a self-contained osx-arm64 publish has to run on the platform it targets.
        runs-on: macos-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: apps/desktop/global.json
                  cache: true
                  cache-dependency-path: '**/packages.lock.json'

            # The same gates the ordinary build job runs. A release that skipped them would be the one
            # build nobody checked.
            - name: Restore
              working-directory: apps/desktop
              run: dotnet restore --locked-mode

            - name: Build
              working-directory: apps/desktop
              run: dotnet build -c Release -warnaserror --no-restore

            - name: Test
              working-directory: apps/desktop
              run: dotnet test -c Release --no-build

            # Builds the native shim, publishes self-contained for Apple Silicon, and assembles the
            # bundle. The script is the same one used by hand, so a release cannot drift from what a
            # developer produces locally.
            # The version is NOT an input. It was, defaulting to a literal that also appeared in
            # `Directory.Build.props`, in the bundle script and in the release notes — four copies,
            # so a release could stamp a bundle with a number the assembly inside it disagreed with.
            # Now it is decided in a changeset, which bumps `apps/desktop/package.json`, and
            # `pnpm release:version` copies it into `Directory.Build.props`; the build job fails when
            # the two disagree. This reads the props, because that is what the assembly is stamped from.
            - name: Read the version
              id: version
              run: |
                  set -euo pipefail
                  version="$(dotnet msbuild apps/desktop/Directory.Build.props -getProperty:Version | tr -d '[:space:]')"
                  test -n "$version"
                  echo "value=${version}" >> "$GITHUB_OUTPUT"

            - name: Build the app bundle
              run: apps/desktop/tools/macos/make-app-bundle.sh "${{ steps.version.outputs.value }}"

            # Zipped with `ditto`, which preserves the resource forks and symlinks inside a bundle.
            # A plain `zip` produces an archive macOS unpacks into something that will not launch.
            - name: Archive
              working-directory: apps/desktop/artifacts
              run: ditto -c -k --sequesterRsrc --keepParent deadair.app "deadair-${{ steps.version.outputs.value }}-osx-arm64.zip"

            # The notes are this version's entry in `apps/desktop/CHANGELOG.md`, cut out with the same
            # awk `release.yml` uses on the station's, and written by `pnpm release:version` from the
            # changesets that named `@deadair/desktop`. A version with no entry fails here rather
            # than publishing a download with nothing said about it. The paragraph about signing is
            # appended to every release, because it is true of every one until the app is signed.
            - name: Take the notes out of the changelog
              env:
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  set -euo pipefail
                  awk -v v="## [${VERSION}]" '
                      index($0, v) == 1 { found = 1; next }
                      found && /^## \[/ { exit }
                      found && /^\[[^]]+\]: / { exit }
                      found { print }
                  ' apps/desktop/CHANGELOG.md > notes.md
                  if ! grep -q '[^[:space:]]' notes.md; then
                      echo "::error::apps/desktop/CHANGELOG.md has no entry for ${VERSION}. Write a changeset naming @deadair/desktop."
                      exit 1
                  fi
                  cat >> notes.md <<'NOTES'

                  It is unsigned, so the first launch needs a right-click and Open. macOS will otherwise
                  refuse it without saying why.
                  NOTES
                  cat notes.md

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "desktop-v${{ steps.version.outputs.value }}" \
                      --title "deadair desktop ${{ steps.version.outputs.value }}" \
                      --notes-file notes.md \
                      ${{ inputs.draft && '--draft' || '' }} \
                      "apps/desktop/artifacts/deadair-${{ steps.version.outputs.value }}-osx-arm64.zip"
