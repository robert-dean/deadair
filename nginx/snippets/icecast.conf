# Icecast mount — identical in dev and prod, since icecast always runs as the
# `icecast` compose service.
#
# `/live.mp3` is the mount stream/radio.liq publishes to (STREAM_MOUNT, whose
# default is in stream/radio.default.env and whose live value the app
# materializes into radio.env from the `stream.mount` setting). nginx cannot
# read that setting, so the two are coupled by hand: change the mount and this
# has to change with it, or the stream falls through to the SPA location below
# and answers 502.
location /live.mp3 {
    proxy_pass http://icecast:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # This is a long-lived streaming response, not a request/response cycle:
    # buffering it would make nginx wait to fill a buffer before forwarding
    # audio to the listener, and a normal keepalive timeout would cut the
    # stream mid-play.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1d;
    send_timeout 1d;
}
