# Prod edge. Overlay on the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds the API container (the root Dockerfile image) and nginx in front of it,
# icecast and the built SPA, so the whole instance is reachable on one origin.
# TLS is expected to terminate upstream (edge/tunnel), which is why nginx binds
# localhost only, matching how icecast is already published in the base file.
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: deadair-app
        container_name: deadair-app
        restart: unless-stopped
        # No `ports`: nginx is the only way in. Runtime config (DATABASE_*,
        # REDIS_*, KMS/JWT secrets, APP_BASE_URL, …) comes from this env file.
        env_file:
            - ./apps/api/.env
        environment:
            PORT: 3000
        # Both directories are runtime state the container writes and would otherwise
        # lose on every replacement: the art cache would re-fetch every image from
        # upstream and GET /art/:id would 404 for rows whose files vanished, and the
        # rotating log history would disappear exactly when it's wanted. Paths match
        # the code defaults (ART_DIR in art.module.ts, LOGS_DIR in setup.server.ts)
        # against the image's /app/apps/api workdir, so no env override is needed.
        # media/ is mounted whole rather than media/art: it is the root for locally
        # cached media bytes, and anything that lands beside art/ later is persisted
        # already instead of needing another compose edit.
        volumes:
            - ./.docvol/media:/app/apps/api/media
            - ./.docvol/logs:/app/apps/api/logs
            # PLUGINS_DIR, where an operator drops a plugin the image does not ship.
            # Without this the mount point is a path inside the container that nothing
            # populates and nothing survives, which makes operator-installed plugins a
            # feature a deployed station does not actually have.
            - ./.docvol/plugins:/app/apps/api/data/plugins
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started

    nginx:
        image: nginx:1.27-alpine
        container_name: deadair-nginx
        restart: unless-stopped
        ports:
            - '127.0.0.1:8080:80'
        volumes:
            - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/snippets:/etc/nginx/snippets:ro
            # Built SPA, served directly by nginx. Requires `pnpm --filter
            # @app/web build` to have run on the host first.
            - ./apps/web/dist:/srv/web:ro
        depends_on:
            app:
                condition: service_started
            icecast:
                condition: service_started
