name: Pull Request

on:
    pull_request:

permissions:
    contents: read

jobs:
    # Which parts of the tree this pull request changed. Seconds, and everything below reads it.
    changes:
        uses: ./.github/workflows/changes.yml

    build:
        needs: [changes]
        uses: ./.github/workflows/build.yml
        with:
            tree: ${{ needs.changes.outputs.tree == 'true' }}
            node: ${{ needs.changes.outputs.node == 'true' }}
            generated: ${{ needs.changes.outputs.generated == 'true' }}
            sidecar: ${{ needs.changes.outputs.sidecar == 'true' }}
            android: ${{ needs.changes.outputs.android == 'true' }}
            desktop: ${{ needs.changes.outputs.desktop == 'true' }}
        secrets: inherit

    # Built and thrown away. A Dockerfile that has stopped building is worth knowing about
    # before it is merged, not on the release that needed it; a pull request that changes nothing
    # the image is built from cannot stop it building.
    images:
        needs: [changes]
        if: needs.changes.outputs.image == 'true'
        uses: ./.github/workflows/images.yml
        with:
            push: false
