# The Icecast mounts — identical in dev and prod, since icecast always runs as the
# `icecast` compose service.
#
# ── Why this is a regex and not a path ─────────────────────────────────────────
# It used to be `location /live.mp3`, back when the MP3 mount was a setting
# (`stream.mount`) that nginx could not read, so the two were coupled by hand.
# The paths are fixed now (`MOUNT_PATHS` in `stream.settings.ts`), but the
# station publishes up to four of them — MP3 always, plus Opus, AAC and FLAC as
# the operator switches them on — and listing four literals here would be a
# second copy of that table to keep in step.
#
# So this matches any single-segment path at the root ending in one of the four
# extensions the station can serve, and needs no rendering, no reload, and no
# second copy of anything. A mount that is switched OFF is proxied to a 404 from
# Icecast, which is the correct answer: the path does not exist.
#
# ── What makes it safe ─────────────────────────────────────────────────────────
# A regex location beats a prefix location in nginx, so anything that must NOT be
# stolen by this has to be fenced with the `^~` modifier, which beats a regex in
# turn. `/api/` is fenced in every server block that includes this file, and so is
# `/assets/` where a static console is served. Both are marked with a comment
# pointing back here.
#
# The single segment is the other half: `^/[^/]+\.` cannot match `/assets/x.mp3`
# or anything else nested, so the fences are belt to its braces rather than the
# only thing standing between the console and Icecast. A mount with a slash in it
# (`/hi/fi.mp3`, which Icecast does allow and nothing here produces) is the one
# case that needs this widened to `^/.+\.` — and needs the fences to be load
# bearing when it is.
#
# Case-sensitive on purpose. Icecast mounts are matched exactly, so a request for
# `/LIVE.MP3` is not a request for this station's mount and should 404 rather than
# be proxied into one.
location ~ ^/[^/]+\.(mp3|opus|aac|flac)$ {
    proxy_pass http://icecast:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # This is a long-lived streaming response, not a request/response cycle:
    # buffering it would make nginx wait to fill a buffer before forwarding
    # audio to the listener, and a normal keepalive timeout would cut the
    # stream mid-play.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1d;
    send_timeout 1d;
}
