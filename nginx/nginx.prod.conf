events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=10s;

    # WHO asked, as opposed to which hop handed the request over.
    #
    # nginx sets `X-Real-IP` to `$remote_addr`, and behind a tunnel or another reverse proxy that
    # address is the PROXY, identically for every caller. The app believes it — `clientAddress`
    # prefers `X-Real-IP`, and both the rate limit bucket and the HLS audience register are keyed
    # on what it answers — so a station reached that way rate limits the whole internet into one
    # bucket and counts its listeners by user agent alone.
    #
    # `real_ip` is the fix, and it belongs here rather than in the app: nginx replaces
    # `$remote_addr` with the address the trusted proxy reported, so `X-Real-IP` and everything
    # keyed on it become the real caller with nothing downstream changed.
    #
    # Empty by default and opted into, for the reason `TRUST_PROXY` is. A forwarded address is a
    # header, and believing one from a peer that is not actually a proxy lets anybody who can
    # reach this port be a different caller on every request — which is worse than one bucket,
    # because it is rate limiting nobody at all. So the operator names their proxy: in the image
    # that is `REAL_IP_FROM` (see docker/rootfs/etc/s6-overlay/scripts/init-station), and in
    # compose it is a file mounted into this directory holding `set_real_ip_from` and
    # `real_ip_header` for whatever is in front.
    include /etc/nginx/realip.d/*.conf;

    # The scheme the BROWSER used, which is not always the one this edge was reached on.
    #
    # `$scheme` is what nginx itself is listening as, and that is http here whatever an operator
    # has put in front. Passing it on unqualified tells the API the connection was plain even when
    # a TLS proxy terminated https one hop out, and the API believes it: the refresh cookie decides
    # whether to mark itself `secure` from this header (see `request.trust.ts`), so a station behind
    # TLS was handing out a session cookie with the flag off.
    #
    # So an inbound claim is passed through and `$scheme` is only the fallback. That is a header
    # from whoever connected, which is worth saying plainly: a client reaching this port directly
    # can assert https and get a cookie their own browser will then refuse to send back over http.
    # It costs them their own login and nobody else anything, and the API still ignores the whole
    # header unless TRUST_PROXY says this edge is real.
    map $http_x_forwarded_proto $forwarded_scheme {
        default    $scheme;
        "~*^https"  https;
    }

    # Where the API is, for the HLS snippet. See nginx/nginx.dev.conf for why this is an
    # upstream block rather than a literal inside the snippet.
    upstream hls_api {
        server app:3000;
    }

    server {
        listen 80;
        server_name _;

        # API. In prod the API is the `app` container (root Dockerfile, PORT=3000).
        # NOTE: no `app` service exists in docker-compose.yml yet — the overlay
        # defines it. The API mounts its ContractKit routers at the ROOT and knows
        # nothing about /api, so the prefix is stripped here: the trailing slash on
        # proxy_pass replaces the matched /api/ with /. The SPA always calls /api
        # (BASE_URL in apps/web/src/api/client.ts), so the prefix exists only to
        # split API traffic from the static SPA at this edge.
        #
        # `^~` because the mount snippet below is a REGEX location, and a regex beats an
        # ordinary prefix. This modifier is what stops an API route whose path happens to
        # end in an audio extension being proxied to Icecast. See nginx/snippets/icecast.conf.
        location ^~ /api/ {
            # ── Liveness, refused at the edge ──────────────────────────────────────
            #
            # `/health` reports `revision`, the commit this image was built from, and it is
            # `security: none` because its callers -- the container's own probe, a process
            # supervisor -- hold no session. That is correct inside the container and wrong
            # from the internet, where it is a build fingerprint anybody can read. Nothing
            # legitimate asks for it through here: the probe in the Dockerfile fetches
            # `127.0.0.1:$PORT/health` directly, and the console reads the SAME revision from
            # `/station/checkup`, which sits behind `platform.view` and carries it for exactly
            # this reason (`StationCheckup` in station.types.ck).
            #
            # An `if` INSIDE this block rather than a `location =` beside it, and both halves
            # of that are forced rather than chosen. `^~` on this prefix means nginx does not
            # consider regex locations at all once it wins, so a `location ~*` sibling would
            # never be reached; and `location =` is case-sensitive and slash-exact while
            # @koa/router is neither -- `ServerKitRouter()` passes no options, so the router
            # takes the library defaults and `/api/Health`, `/api/HEALTH` and `/api/health/`
            # all reach the handler. All three were measured answering 200 straight past a
            # `location = /api/health`, which is why that shape is gone.
            #
            # `return` is one of the two directives that is genuinely safe inside `if`, so the
            # usual warning about `if` in a location does not apply to this one.
            #
            # nginx has already merged slashes and decoded %XX into `$uri` by here, so
            # `/api//health` and `/api/%68ealth` are the same string this tests and need no
            # arm of their own. `$uri` also excludes the query, so nothing can be hidden there.
            #
            # 404 rather than 403, on the rule the station already follows for a rejected HLS
            # name: a caller trying it on learns nothing from being told they were caught.
            if ($uri ~* "^/api/health(check)?/*$") { return 404; }

            proxy_pass http://app:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;

            # SSE (the monitoring bus) lives under this prefix, so buffering has
            # to be off or events queue instead of arriving as they're emitted.
            proxy_buffering off;
            proxy_read_timeout 1h;
            client_max_body_size 64m;
        }

        include /etc/nginx/snippets/icecast.conf;
        include /etc/nginx/snippets/hls.conf;

        # nginx serves the built SPA, and is the only thing that does: the API has
        # no static middleware and is not growing one, because an edge has to exist
        # here anyway for the stream. The production image bakes this same shape in
        # (docker/nginx.conf), differing only in where the upstreams are.
        root /srv/web;
        index index.html;

        # Vite emits content-hashed filenames under /assets, so they're
        # immutable; everything else falls through to the SPA history fallback.
        #
        # `^~` for the same reason as /api/ above: a regex location would otherwise be
        # free to claim any of the console's build output.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
