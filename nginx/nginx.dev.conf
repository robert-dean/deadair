events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Docker's embedded DNS, re-resolved so a restarted upstream container's new
    # IP is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s;

    # The scheme the BROWSER used rather than the one this edge listens as. Dev is http both ways,
    # so this changes nothing here and exists so the two edges stay one shape; the reasoning is in
    # nginx/nginx.prod.conf.
    map $http_x_forwarded_proto $forwarded_scheme {
        default    $scheme;
        "~*^https"  https;
    }

    server {
        listen 80;
        server_name _;

        # API. In dev both the API and Vite run on the HOST (`pnpm dev`), not as
        # compose services, so they're reached through host.docker.internal
        # (mapped to host-gateway in the compose overlay). 3333 is PORT in
        # apps/api/.env. The API mounts its ContractKit routers at the ROOT and
        # knows nothing about /api, so the prefix is stripped here: the trailing
        # slash on proxy_pass replaces the matched /api/ with /. This mirrors the
        # rewrite in apps/web/vite.config.ts, which is why the SPA works when it
        # talks to Vite directly but 404s through this edge without it.
        location /api/ {
            proxy_pass http://host.docker.internal:3333/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;

            # SSE (the monitoring bus) lives under this prefix, so buffering has
            # to be off or events queue instead of arriving as they're emitted.
            proxy_buffering off;
            proxy_read_timeout 1h;
            client_max_body_size 64m;
        }

        include /etc/nginx/snippets/icecast.conf;

        # Everything else goes to the Vite dev server.
        location / {
            proxy_pass http://host.docker.internal:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;

            # Vite HMR is a websocket; without these it falls back to polling
            # or fails outright.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
    }
}
