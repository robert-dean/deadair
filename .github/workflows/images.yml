name: Images

on:
    workflow_call:
        inputs:
            push:
                description: Publish the images, rather than only proving they build.
                type: boolean
                default: false
            version:
                description: >-
                    The release these images are, without a leading v, stamped inside them. Empty on
                    every run that is not a release, which is most of them: an ordinary push builds
                    nothing claiming to be one. The version TAG is not published here; see promote
                    in release.yml.
                type: string
                default: ''
permissions:
    contents: read

env:
    # A caller that needs this — `promote` in release.yml — has to write it out again. Publishing
    # it as a workflow output was tried and cannot work: the registry username is a secret and is
    # a substring of this, so Actions drops the output rather than leaking it.
    IMAGE: deadair/deadair

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            # One variant failing should not hide the state of the others.
            fail-fast: false
            matrix:
                include:
                    # The station and nothing under it: the operator brings a database, a cache
                    # and a speech server of their own.
                    - variant: slim
                      args: |
                          WITH_TTS=0
                          WITH_DB=0
                    # The default. A speech server is bundled because a station with no voice is
                    # not a station; the database and cache are still the operator's.
                    - variant: latest
                      args: |
                          WITH_TTS=1
                          WITH_DB=0
                    # Everything, for a host with nothing on it.
                    - variant: full
                      args: |
                          WITH_TTS=1
                          WITH_DB=1

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # A hosted runner arrives with an Android SDK, a .NET installation and a tool cache
            # holding several language runtimes, none of which this job touches: it checks out a
            # repository and hands a Dockerfile to a daemon. They are worth about twenty gigabytes,
            # and without them gone the two variants carrying a speech server fill the disk — far
            # enough that the runner could not write its own log, which is why that failure arrived
            # as a job with no output rather than as an error.
            #
            # `df` on both sides because the next person to run out of room should be able to see
            # how much this actually bought on the day it stopped being enough.
            #
            # It is skipped for `slim`, which carries neither a speech server nor a database and
            # was never the variant that filled the disk — a minute and a half of deleting things
            # to make room for an image that already fits.
            #
            # The paths go in parallel rather than as one `rm -rf`. The list is unchanged and
            # deliberately so: this step is the only thing standing between the big variants and a
            # failure that arrives as a job with no output, so the way to make it cheaper is to
            # spend less WALL CLOCK on the same deletions, never to delete less of them.
            - name: Make room for the image
              if: matrix.variant != 'slim'
              run: |
                  df -h /
                  for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift /opt/hostedtoolcache; do
                      sudo rm -rf "$path" &
                  done
                  wait
                  df -h /

            - name: Set up Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            # Asked before the build rather than discovered at the login step, so that a release
            # with no credentials says the one useful sentence instead of failing somewhere in
            # Docker's error vocabulary — and asked only on a run that means to publish, since a
            # pull request is deliberately never given them and would otherwise fail every time.
            #
            # It FAILS rather than warns. This warned once, and the release that followed built all
            # three variants, published none of them, and went green: the registry stayed empty
            # while the run said everything was fine.
            - name: Check for registry credentials
              id: credentials
              if: inputs.push
              env:
                  USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
              run: |
                  if [ -n "$USERNAME" ]; then
                      echo 'present=true' >> "$GITHUB_OUTPUT"
                  else
                      echo "::error::No registry credentials. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the repository's Actions secrets."
                      exit 1
                  fi

            - name: Log in to the registry
              if: inputs.push
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Only the COMMIT tag is published here, and the mutable one (`latest`, `slim`, `full`)
            # is moved onto it later by whoever called this workflow, once the tests have passed.
            # That split is what lets this job run beside the build instead of behind it: a tag
            # nobody pulls by name costs nothing if the tests then fail, where waiting for them
            # cost four and a half minutes on every release.
            #
            # `latest` is the default variant, so its commit tag is the bare sha; the other two
            # prefix theirs, because a sha alone would not say which station it was.
            #
            # The VERSION tag is NOT published here, though it once was, on the argument that an
            # exact version is immutable and belongs with the immutable commit tag. It stopped being
            # true when releases stopped being tags: a release whose tests fail now cuts no git tag
            # and is retried by the next push to main at the same version, so a version tag pushed
            # here before the tests would name an untested image until the retry overwrote it. It is
            # a registry retag in `promote` instead, after the tests, so it exists only once the
            # release does.
            - name: Work out the tags
              id: tags
              run: |
                  set -eu
                  if [ "${{ matrix.variant }}" = "latest" ]; then
                      prefix=""
                  else
                      prefix="${{ matrix.variant }}-"
                  fi

                  # Written a line at a time rather than built as one multi-line string: a
                  # continuation line inside this block carries the YAML's own indentation, which
                  # would end up INSIDE the tag.
                  {
                      echo "value<<TAGS"
                      echo "${IMAGE}:${prefix}${GITHUB_SHA}"
                      echo "TAGS"
                  } >> "$GITHUB_OUTPUT"

            - name: Build${{ inputs.push && ' and push' || '' }}
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  push: ${{ inputs.push }}
                  # A run that does not publish exports NOTHING: the image is built into the
                  # builder's own cache and thrown away with the runner. It used to be loaded into
                  # the runner's daemon, which cost two minutes of exporting and re-importing a
                  # multi-gigabyte image on every pull request, and the only thing that read it was
                  # a two-second `import app` against the sidecar. That check is a layer in the
                  # Dockerfile now, so it runs inside this build in every variant and on every run,
                  # publishing or not, and nothing downstream needs the image on disk.
                  outputs: ${{ !inputs.push && 'type=cacheonly' || '' }}
                  platforms: linux/amd64
                  # The variant's own two arguments, plus the commit, which every variant gets and
                  # so is not in the matrix. It is the same sha the tag above is built from — the
                  # point of putting it INSIDE the image is that a running station can be asked
                  # what it is without anybody having to know which tag it was pulled from.
                  build-args: |
                      ${{ matrix.args }}
                      REVISION=${{ github.sha }}
                      VERSION=${{ inputs.version }}
                  tags: ${{ steps.tags.outputs.value }}
                  # The cache lives in the registry beside the images rather than in the Actions
                  # cache, which holds ten gigabytes for the whole repository — less than these
                  # three variants together, so they would spend every run evicting each other and
                  # rebuilding what they evicted. Per variant, because they diverge only in their
                  # last layers and one scope would have three jobs writing over each other.
                  cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}
                  # Only a run that can log in can write it. A pull request reads the cache the
                  # last release left and publishes nothing, which is the whole shape of this
                  # workflow one level down.
                  cache-to: ${{ inputs.push && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE, matrix.variant) || '' }}
