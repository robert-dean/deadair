# The edge, inside the container.
#
# Deliberately the same shape as the compose edge this station has always run behind
# (nginx/nginx.prod.conf), and for the same reasons: the trailing slash on the API proxy is what
# strips `/api`, because the API mounts its routers at the ROOT and the console always calls
# `/api`; buffering is off because the console holds an event stream open; and the stream mount is
# proxied with the timeouts of something a listener stays connected to for hours.
#
# What differs is only where the upstreams are. In one container they are all loopback — and they
# are written here as the names the station uses everywhere else, which the boot script resolves
# to 127.0.0.1 in /etc/hosts. That is what lets one set of defaults describe both worlds instead
# of a second set that has to be kept in step with the first.

user deadair;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # WHO asked, where the operator has named what sits in front of this edge. Rendered at boot
    # from `REAL_IP_FROM` by `docker/rootfs/etc/s6-overlay/scripts/init-station`, which is also
    # where the argument for it is; with nothing named this directory is empty and nginx behaves
    # exactly as it did. In `http` rather than in one of the snippets below because `$remote_addr`
    # is decided before any location is chosen, and everything downstream — `X-Real-IP`, the rate
    # limit bucket, the HLS audience register — is built from it.
    include /etc/nginx/realip.d/*.conf;

    # The scheme the BROWSER used. `$scheme` is what this edge is listening as, which is http
    # whatever an operator has put in front, so an inbound claim is passed through and `$scheme` is
    # the fallback — otherwise a station behind a TLS proxy tells the API its connection was plain
    # and the refresh cookie drops its `secure` flag. See nginx/nginx.prod.conf for the whole
    # argument, including what a direct caller asserting https costs (their own login, and nothing
    # else).
    map $http_x_forwarded_proto $forwarded_scheme {
        default    $scheme;
        "~*^https"  https;
    }

    # Where the API is, for the HLS snippet. Loopback here like every other upstream in
    # this file; the boot script resolves `app` in /etc/hosts.
    upstream hls_api {
        server app:3000;
    }

    server {
        listen 80;
        server_name _;

        # `^~` because the mount snippet below is a REGEX location, and a regex beats an
        # ordinary prefix. This modifier is what stops an API route whose path happens to
        # end in an audio extension being proxied to Icecast. See nginx/snippets/icecast.conf.
        location ^~ /api/ {
            # ── Liveness, refused at the edge ──────────────────────────────────────
            #
            # `/health` reports `revision`, the commit this image was built from, and it is
            # `security: none` because its callers -- the container's own probe, a process
            # supervisor -- hold no session. That is correct inside the container and wrong
            # from the internet, where it is a build fingerprint anybody can read. Nothing
            # legitimate asks for it through here: the probe in the Dockerfile fetches
            # `127.0.0.1:$PORT/health` directly, and the console reads the SAME revision from
            # `/station/checkup`, which sits behind `platform.view` and carries it for exactly
            # this reason (`StationCheckup` in station.types.ck).
            #
            # An `if` INSIDE this block rather than a `location =` beside it, and both halves
            # of that are forced rather than chosen. `^~` on this prefix means nginx does not
            # consider regex locations at all once it wins, so a `location ~*` sibling would
            # never be reached; and `location =` is case-sensitive and slash-exact while
            # @koa/router is neither -- `ServerKitRouter()` passes no options, so the router
            # takes the library defaults and `/api/Health`, `/api/HEALTH` and `/api/health/`
            # all reach the handler. All three were measured answering 200 straight past a
            # `location = /api/health`, which is why that shape is gone.
            #
            # `return` is one of the two directives that is genuinely safe inside `if`, so the
            # usual warning about `if` in a location does not apply to this one.
            #
            # nginx has already merged slashes and decoded %XX into `$uri` by here, so
            # `/api//health` and `/api/%68ealth` are the same string this tests and need no
            # arm of their own. `$uri` also excludes the query, so nothing can be hidden there.
            #
            # 404 rather than 403, on the rule the station already follows for a rejected HLS
            # name: a caller trying it on learns nothing from being told they were caught.
            if ($uri ~* "^/api/health(check)?/*$") { return 404; }

            proxy_pass http://app:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;

            proxy_buffering off;
            proxy_read_timeout 1h;
            client_max_body_size 64m;
        }

        include /etc/nginx/snippets/icecast.conf;
        include /etc/nginx/snippets/hls.conf;

        root /srv/web;
        index index.html;

        # `^~` for the same reason as /api/ above: the console's build output is served
        # from here, and a regex location would otherwise be free to claim any of it.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
