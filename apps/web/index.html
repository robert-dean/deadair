<!doctype html>
<html lang="en" data-da-theme="carbon" data-mantine-color-scheme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <title>deadair</title>
        <style>
            /*
             * Painted before the bundle loads so there is no flash of the wrong console. The hexes
             * are duplicated from `--da-bg` in src/tokens.css deliberately: this has to paint
             * before any stylesheet exists, so it cannot read the tokens it is copying. There are
             * three of them now, for the same one reason.
             */
            html,
            body {
                margin: 0;
                background-color: #0c0e0d;
            }

            html[data-da-theme='white'],
            html[data-da-theme='white'] body {
                background-color: #f4f1ea;
            }

            html[data-da-theme='neon'],
            html[data-da-theme='neon'] body {
                background-color: #060a0c;
            }
        </style>
        <!-- The stored theme, before the first paint. A file rather than inline; public/theme.boot.js says why. -->
        <script src="/theme.boot.js"></script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
