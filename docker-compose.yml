services:
    db:
        image: postgres:17
        restart: unless-stopped
        container_name: deadair-db
        ports:
            - '55432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: deadair
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'deadair']
            interval: 5s
            timeout: 5s
            start_period: 10s
            retries: 5
        volumes:
            - ./.docvol/snapshots:/snapshots

    redis:
        image: redis
        container_name: deadair-redis
        restart: unless-stopped
        ports:
            - '6379:6379'
        expose:
            - 6379
        environment:
            - REDIS_PORT=6379
        command: redis-server

    # Local Kokoro TTS for the render pipeline: an OpenAI-compatible
    # /v1/audio/speech endpoint that turns generated scripts into voice segments.
    # The render pipeline points TTS_BASE_URL at it (http://kokoro:8880/v1 in a
    # container, http://localhost:8880/v1 for host `pnpm dev`). Kokoro is tiny
    # (82M params); CPU synthesis is a few seconds per segment, which is fine
    # because segments are pre-rendered ahead of air — latency doesn't matter.
    kokoro:
        # :latest is fine to start; pin a release tag once settled. NVIDIA users
        # can swap in ghcr.io/remsky/kokoro-fastapi-gpu.
        image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
        container_name: deadair-kokoro
        restart: unless-stopped
        ports:
            - '8880:8880'
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://localhost:8880/health')"
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s
        # ── Imported voicepacks (voice import feature) ─────────────────────────
        # The app writes uploaded .pt files to ./.docvol/voices (VOICES_DIR on the
        # app side, /imported-voices here). To serve them AND keep the bundled voices
        # (af_heart, am_adam, …) without shadowing them, the startup script seeds the
        # image's built-in voicepacks into the shared dir once (cp -n = never clobber
        # an import), then replaces the image voices dir (/app/api/src/voices/v1_0)
        # with a symlink to the shared dir. Result: built-ins + live-uploaded voices
        # are both served, and a new import is picked up without a rebuild. If your
        # Kokoro build caches the voice list at boot, `docker compose restart kokoro`
        # after an import. `$$` escapes compose interpolation so the shell expands it.
        volumes:
            - ./.docvol/voices:/imported-voices
        entrypoint: ['/bin/sh', '-lc']
        command:
            - >
                SRC=/app/api/src/voices/v1_0; DEST=/imported-voices;
                mkdir -p "$$DEST";
                cp -rn "$$SRC"/. "$$DEST"/ 2>/dev/null || true;
                rm -rf "$$SRC" && ln -s "$$DEST" "$$SRC";
                exec uv run --extra cpu --no-sync python -m uvicorn api.src.main:app --host 0.0.0.0 --port 8880 --log-level debug

        # ── Self-hosted stream (Milestone 1: voice-only) ────────────────────────────
    # Icecast is the public MP3 mount; Liquidsoap loops the pre-rendered podcast
    # voice MP3s into it. The app and factory-worker run on the host (pnpm dev /
    # pnpm factory), not here — this compose file is just the backing services.
    # Each stream container seeds a committed static default config onto the
    # streamconfig volume on a cold start; the host app overwrites it from the DB
    # settings if it points STREAM_CONFIG_DIR at the shared volume. See
    # stream/README.md.
    icecast:
        image: libretime/icecast:2.4.4
        container_name: deadair-icecast
        restart: unless-stopped
        # Use the app-rendered config from the volume if it exists; otherwise fall
        # back to the committed static default (read-only from /defaults). This lets
        # the stream start on its own with no write to the volume and no dependency
        # on `app`; once the app renders /streamconfig/icecast.xml it's used on the
        # next restart.
        entrypoint:
            - sh
            - -c
            # $$ escapes compose interpolation so the shell (not compose) expands $cfg.
            - 'cfg=/streamconfig/icecast.xml; [ -f "$$cfg" ] || cfg=/defaults/icecast.xml; exec icecast -c "$$cfg"'
        ports:
            # localhost only; the edge/tunnel fronts it (HTTPS terminates at the edge).
            - '127.0.0.1:8000:8000'
        volumes:
            - ./.docvol/streamconfig:/streamconfig:ro
            # Committed static boot default, read directly when the volume is empty.
            - ./stream/icecast.default.xml:/defaults/icecast.xml:ro
        # No healthcheck: this image ships no HTTP client (no wget/curl/busybox, only
        # libcurl4), so an in-container HTTP probe can't run. Verify from the host
        # instead (curl http://127.0.0.1:8000/status-json.xsl — see stream/README.md).

    liquidsoap:
        # Custom image = stock Liquidsoap + the Spotify track shim, so a Spotify track can be
        # fetched as a file the queue downloads ahead of air. The first build compiles the shim
        # from a pinned go-librespot checkout and is slow; it's cached after.
        build:
            context: .
            dockerfile: stream/Dockerfile
        image: deadair-liquidsoap
        container_name: deadair-liquidsoap
        restart: unless-stopped
        # Reach the host-run app (pnpm dev) for the Spotify login the shim opens its session with.
        # Override SPOTIFY_LOGIN_URL to http://app:3333/... when running the app in-container
        # (--profile app). No /api prefix: the API mounts its routers at the root, and the prefix
        # the SPA uses is added and stripped by the dev proxy in front of it.
        # No SPOTIFY_LOGIN_SECRET here: the app seeds it in the DB and
        # materializes it into radio.env, which the entrypoint sources (`set -a`), so the shim
        # inherits it — no host export or compose env needed.
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            SPOTIFY_LOGIN_URL: ${SPOTIFY_LOGIN_URL:-http://host.docker.internal:3333/playout/spotify/session-login}
        # 8005 is the harbor voice input: the host-run app (pnpm dev) pushes rendered DJ
        # audio to http://127.0.0.1:8005/dj; the in-container app reaches it as liquidsoap:8005.
        # Must match HARBOR_PORT in radio.env. The playout control endpoints (/control/status,
        # /control/push, /control/flush — how the app hands the rundown over) share this port,
        # since harbor dispatches by path. localhost-only — never expose the harbor publicly.
        # 3679 is the Spotify track shim (stream/spotify-shim): the app resolves a rundown item to
        # a signed URL on it, and Liquidsoap downloads the track from it ahead of air. Published on
        # localhost so a host-run app (pnpm dev) can reach it for diagnostics.
        ports:
            - '127.0.0.1:3679:3679'
            - '127.0.0.1:8005:8005'
        # Use the app-rendered env from the volume if it exists; otherwise fall back
        # to the committed static default (read-only from /defaults). Source it, then
        # run. Lets the stream start on its own; the app overwrites radio.env once it
        # boots (effective on the next restart).
        entrypoint: ['sh', '-lc']
        # $$ escapes compose interpolation so the shell (not compose) expands $cfg.
        # The track shim is backgrounded before the exec: it inherits the sourced radio.env (its
        # signing secret and the credential bridge live there), and it is not an audio source, so
        # nothing in radio.liq spawns it. Liquidsoap stays PID 1's child so signals still reach it.
        command:
            [
                'cfg=/streamconfig/radio.env; [ -f "$$cfg" ] || cfg=/defaults/radio.env; set -a; . "$$cfg"; sh /usr/local/bin/spotify-shim-run.sh & exec liquidsoap /radio/radio.liq',
            ]
        volumes:
            - ./stream/radio.liq:/radio/radio.liq:ro
            # Mounted (not just baked) so the launchers can be tuned without a rebuild.
            - ./stream/spotify-shim-run.sh:/usr/local/bin/spotify-shim-run.sh:ro
            - ./stream/station-id.mp3:/radio/station-id.mp3:ro
            # Rights-cleared music bed: liquidsoap loops these under the voice
            # (MUSIC_DIR=/music). Empty until you drop tracks in; falls back to the
            # station ident, so a gap inside a programme never becomes dead air.
            # Neither plays unless deadair holds the control lease (stream/README.md).
            - ./stream/music:/music:ro
            # Committed static boot default, read directly when the volume is empty.
            - ./stream/radio.default.env:/defaults/radio.env:ro
            - ./.docvol/streamconfig:/streamconfig:ro
            # NB: no /feeds mount — the DJ voice is no longer read from files. The app
            # streams every rendered segment to the harbor input (port 8005) instead, so
            # Liquidsoap needs no access to apps/api/public/feeds.
            # The track shim's log. Writable. See stream/README.md.
            - ./.docvol/streamlogs:/streamlogs
        depends_on:
            # service_started (not _healthy): icecast has no healthcheck (see above),
            # and liquidsoap's output.icecast retries the source connection on its own.
            icecast:
                condition: service_started
