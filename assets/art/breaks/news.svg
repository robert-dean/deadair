<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- The picture a news break wears. Drawn for this repository; see MANIFEST.json.

         A folded sheet rather than a microphone or a mast: both of those read as "the station is
         talking", which is every other kind of break. The masthead bar and the column rules are
         cut OUT of the ink in the background colour, so the whole thing survives being drawn at
         28 pixels in a running-order row. -->
    <rect width="512" height="512" fill="#2FD98C"/>
    <g transform="rotate(-4 256 256) translate(256 256) scale(1.14) translate(-256 -256)">
        <!-- The sheet. -->
        <rect x="112" y="128" width="288" height="256" rx="18" fill="#121514"/>
        <!-- The masthead, then the photo block and its columns. -->
        <g fill="#2FD98C">
            <rect x="144" y="162" width="224" height="30" rx="8"/>
            <rect x="144" y="222" width="94" height="76" rx="8"/>
            <rect x="258" y="222" width="110" height="16" rx="8"/>
            <rect x="258" y="252" width="110" height="16" rx="8"/>
            <rect x="258" y="282" width="110" height="16" rx="8"/>
            <rect x="144" y="322" width="224" height="16" rx="8"/>
        </g>
    </g>
</svg>
