name: Build

on:
    workflow_call:

# The build reads the repo and nothing else. Publishing is the images workflow's job,
# with its own credentials.
permissions:
    contents: read

jobs:
    # Compiling and testing are two jobs now, and they run side by side. `build` is the type check
    # — `apps/api`'s build task IS `tsc` — and it is also the only writer of the task cache. The
    # tests below do not wait on it: they compile what they need themselves, out of the same cache,
    # which costs a little duplicated work and saves the whole of this job's minute on the clock.
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Don't leave the token in .git/config for the install and build steps.
                  persist-credentials: false

            # pnpm comes from this action rather than corepack: Node 25 and later no longer
            # ship a corepack binary, so `corepack enable` on a modern runner is a command
            # that is not there. The version still comes from the repo's `packageManager`.
            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            # Turbo hashes each task's inputs and files the result under that hash, so what this
            # restores is per-PACKAGE rather than all-or-nothing: a commit touching `apps/api`
            # replays the build of every package it did not touch and recompiles only the ones it
            # did. The key carries the commit so every run writes a fresh entry, and the prefix
            # restore-key is the whole mechanism — an exact key can never hit on a commit that has
            # not been built before, so without the prefix this would restore nothing, ever.
            #
            # THIS JOB IS THE ONLY WRITER. The test shards restore the same cache read-only, so
            # five jobs do not race to save the same key and lose four of the writes to a warning.
            #
            # It shares the repository's ten gigabytes with the pnpm store above it and nothing
            # else, which is only true because the IMAGE cache was deliberately put in the registry
            # instead — three variants of this station do not fit in ten gigabytes alongside
            # anything. That is what leaves room for this. Keep it that way.
            - name: Restore the task cache
              uses: actions/cache@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # A step here rather than a job of its own, because the check is two seconds against a
            # thirty-second install and a job would pay the install to run it. It sits ahead of the
            # build so it answers before the slow thing starts.
            #
            # NOT `turbo run`, unlike everything else in this file. Formatting has no dependency
            # graph and Prettier reads the whole tree in one pass, so fanning it out over fifteen
            # packages would pay fifteen startups for one answer — the same arithmetic that split
            # the test suite at the root instead of per package.
            #
            # It is also not part of `pnpm lint`, which is where somebody will look for it. That
            # script is `eslint --fix` in every package and nothing in CI runs it, so a check
            # written into a FIXER that no workflow calls is a gate in a room nobody enters.
            #
            # And it passes NO `--ignore-path`, which is the opposite of what every package's
            # `format` script does and is deliberate. Prettier 3 defaults that option to BOTH
            # `.gitignore` and `.prettierignore`, so naming one replaces the pair and the walk loses
            # `.gitignore` — it then descends into `.turbo/cache`, which is a week of build
            # artifacts. Measured here: 26 seconds with the default, still running after 45 with the
            # flag. From the root Prettier finds `.prettierignore` on its own.
            - name: Check formatting
              run: pnpm format:check

            # Never `codegen` here. The contracts, permissions and Kysely types are committed,
            # and regenerating them needs a live database (build:datatypes runs after migrate:up).
            - name: Build
              run: pnpm build

            # Every run saves an entry holding what it restored PLUS what it added, so left alone
            # this grows by a full build per commit and spends the repository's cache budget on
            # results nothing will ask for again. A week is well past the point where a task's
            # inputs are still current, and an entry deleted too eagerly costs one rebuild rather
            # than a wrong answer. `always()` because a run that failed still cached whatever it
            # got through first, and that is worth keeping and worth pruning.
            #
            # It runs as an ordinary step so it lands before the cache action's own post step,
            # which is what actually writes the entry.
            - name: Age out stale task results
              if: always()
              run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

    # The suite, split four ways.
    #
    # It is split at the ROOT rather than per package, and which way round that goes is the whole
    # point. Run through turbo the suite pays one vitest STARTUP per package, and the startups are
    # the cost, not the assertions: measured locally, `apps/api` alone is 3736 tests in 18 seconds
    # while the fourteen smaller packages are half as many tests in 55. Sharding the big suite
    # would have split the cheap half and left the expensive one alone. One root run sees all 310
    # files at once, shares a transform cache and a single worker pool across them, and `--shard`
    # then cuts that whole thing into four — which is also why this does not run through
    # `turbo run test` and gets no task caching. On a two-core runner the pool it stops
    # oversubscribing is worth more than the replays it gives up.
    #
    # `vitest.config.ts` at the root is what makes one run possible; it names each package's own
    # config as a project rather than replacing it, so nothing about running one package's tests
    # by hand has changed. Verified before relying on it: the root run is 310 files and 5329
    # assertions, which is exactly the sum of the thirteen per-package reports it replaces, and the
    # four shards come to 78 + 78 + 77 + 77 — the same 310, so no file is dropped or run twice.
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            # A shard failing should not hide the state of the other three.
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            # Read-only, and deliberately not `needs: build`. Waiting for the compile would put its
            # whole minute back on the clock, which is the thing splitting these jobs was for; the
            # previous release's entry is a good enough starting point, and anything this commit
            # actually changed is recompiled here in parallel rather than once in series.
            - name: Restore the task cache
              uses: actions/cache/restore@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The tests import their own sources, but they import their DEPENDENCIES through each
            # package's exports, which point at `dist`. So the workspace has to be built first even
            # though nothing here type-checks it — that is the job above.
            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

    # The measurement sidecar is Python, not TypeScript, and stands alone here rather than
    # riding the turbo test path or the root `vitest.config.ts` — a Python job has nothing to
    # share with either.
    #
    # No `pnpm install`, no `dist`: this installs the sidecar's own pins with pip and runs
    # pytest directly against `analysis/`, the same way it runs on a laptop.
    sidecar:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # 3.13, to match `analysis/Dockerfile`'s base image.
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            # These four are read from `analysis/requirements.txt` and must move with it — the
            # beat tracker's own pin is deliberately not here, since importing it needs the
            # `--no-deps` torch stack `analysis/requirements.nodeps.txt` installs, which pytest's
            # collected modules never import.
            - name: Install the sidecar's test dependencies
              run: pip install numpy==2.4.1 scipy==1.16.2 fastapi==0.120.4 pydantic==2.13.1 pytest

            - name: Test
              run: python3 -m pytest analysis/

    # The Android listener, which is Kotlin and Gradle and stands alone here for the same reason
    # the sidecar above does: a Gradle build shares no task graph, no `dist` and no test runner with
    # the TypeScript tree, so riding turbo or the root `vitest.config.ts` would buy nothing. No
    # `pnpm install`, no Node at all.
    #
    # It is also the only thing that COMPILES `packages/sdk-kotlin`. The `generated` job below
    # regenerates that from the contracts and checks it did not move; this checks it is Kotlin a
    # compiler accepts, which is a different question and was answered "no" the first time it was
    # asked.
    #
    # The runner ships an Android SDK at `/usr/local/lib/android/sdk` and `ANDROID_HOME` already
    # points at it. `images.yml` deletes that directory to make disk room, which is a different
    # workflow on a different runner and does not reach here.
    android:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # 21, to match the toolchain the app is built with locally.
            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            # Also validates the committed wrapper jar against Gradle's published checksums, which
            # is the one thing about a binary in the tree worth checking on every run.
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Accept the SDK licences
              run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

            # `:sdk:build` first and by name, so a generator that emitted Kotlin which does not
            # compile fails as itself rather than as a puzzling error inside the app.
            #
            # `:app:bundleRelease` is here for R8 and nothing else. Minification is the one part of
            # this build that can break without a single source file changing — a new dependency
            # whose reflection nothing keeps, and the serializers vanish — and it fails at DECODE on
            # a listener's phone rather than at compile. Building the bundle every run is what turns
            # that into a red check. The artifact is thrown away: this runner holds no signing key,
            # so it comes out unsigned, and the checkout is shallow so its version code is 1. Both
            # are fine for something nobody uploads.
            - name: Build, test and lint
              working-directory: apps/android
              run: ./gradlew --no-daemon :sdk:build :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease

    # Whether what is COMMITTED is what the inputs actually produce.
    #
    # The contracts, the permission types and the Kysely types are generated and checked in, and the
    # build job above is explicitly forbidden from regenerating them — a build that silently rewrites
    # its own source hides exactly the mistake this repository is most exposed to, which is an edited
    # `.ck` or `.perm` or migration merged without the output beside it. Nothing was checking the
    # other half either, so the two could disagree indefinitely and the first symptom would be a
    # route answering a shape the SDK does not have.
    #
    # So this job regenerates all three into a throwaway checkout and fails if anything moved. It is
    # the only job here that may run `codegen`, and it may because the database it needs is its own:
    # a service container migrated from zero, which is a second thing worth knowing — `migrate:up`
    # from an empty database is otherwise only ever exercised on somebody's laptop.
    #
    # `git status --porcelain` rather than `git diff` because a generator that starts writing
    # somewhere NEW is the same failure as one whose output changed, and an untracked file does not
    # show up in a diff. Everything the job itself writes (`.env`, `.turbo`, `.contractkit/`) is
    # already ignored.
    generated:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        services:
            # The same major the station runs. `postgres` is the owner here because a throwaway
            # database has no runtime path to protect; `0000_initial.sql` creates `app_user` itself,
            # so nothing has to be provisioned before the walk.
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: deadair
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # kysely-codegen reads its address out of `apps/api/.env` (`envFile` in
            # `.kysely-codegenrc.json`) and dbmate reads `DATABASE_URL`, so one ignored file answers
            # both. It names the service container, which is reachable on localhost because the job
            # itself runs on the host rather than in a container.
            - name: Point the generators at the throwaway database
              run: printf 'DATABASE_URL=postgres://postgres:postgres@localhost:5432/deadair?sslmode=disable\n' > apps/api/.env

            - name: Regenerate the permission types
              run: pnpm build:permissions

            - name: Regenerate the contracts, the routers and the SDK
              run: pnpm build:contracts

            - name: Walk the migrations from zero
              run: pnpm migrate:up

            - name: Regenerate the Kysely types
              run: pnpm build:datatypes

            - name: Fail on anything that moved
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      echo "::error::Generated output does not match its inputs. Run 'pnpm codegen' (needs a live database) and commit the result."
                      git status --porcelain
                      git --no-pager diff
                      exit 1
                  fi
                  echo "Generated output matches its inputs."
