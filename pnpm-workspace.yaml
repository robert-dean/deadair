packages:
    - apps/*
    - packages/*
    - plugins/*

allowBuilds:
    '@swc/core': true
    cbor-extract: true
    # Pulled in by the site's Docusaurus. Its postinstall prints a funding banner and builds nothing.
    core-js: false
    esbuild: true
    protobufjs: true

minimumReleaseAgeExclude:
    - injectkit
    - '@maroonedsoftware/*'
    - '@contractkit/*'

confirmModulesPurge: false

# See the workspace CLAUDE.md: pnpm's pre-run dependency check misfires in sandboxed
# sessions (project-local .pnpm-store path drift). Warn instead of trying to reinstall.
verifyDepsBeforeRun: warn
