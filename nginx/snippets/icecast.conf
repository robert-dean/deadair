# Icecast mount — identical in dev and prod, since icecast always runs as the
# `icecast` compose service. `/radio.mp3` is a PLACEHOLDER: stream/radio.liq
# (the liquidsoap output.icecast mount name) and stream/icecast.default.xml
# don't exist in this checkout yet, so match this to whatever mount they
# actually define once restored.
location /radio.mp3 {
    proxy_pass http://icecast:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # This is a long-lived streaming response, not a request/response cycle:
    # buffering it would make nginx wait to fill a buffer before forwarding
    # audio to the listener, and a normal keepalive timeout would cut the
    # stream mid-play.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1d;
    send_timeout 1d;
}
