# Releasing the Stream Deck plugin: building it, packing the installer, and publishing it as a GitHub
# release tagged `streamdeck-v<version>`.
#
# `release.yml` calls this on the push that RELEASES it: a push to main where
# `apps/streamdeck/package.json` names a version with no `streamdeck-v*` tag, which is true of one
# commit per version, the merge of the version pull request. That is the station's own rule, so a
# typo in a README releases nothing, and a release waits for the build and tests of that push. It
# can also be run by hand, to retry a release that failed or to draft one; a hand run releases only
# from main, for the station's reason: a tag must never name a commit main never had.
#
# The tag is `streamdeck-v<version>`, NOT `v<version>`. The bare `v*` namespace is the station's,
# which is what an operator means by "a deadair release".
#
# The release carries the `.streamDeckPlugin` installer, which the Stream Deck app installs on a
# double-click, on macOS and Windows alike. The Marketplace is not reached from here: the maintainer
# uploads this same file in Elgato's Maker Console, whose documentation describes no API, so a
# release is the installer's permanent address and the Marketplace listing is a copy of it.

name: Stream Deck release

on:
    workflow_dispatch:
        inputs:
            draft:
                description: Create the release as a draft rather than publishing it
                type: boolean
                default: true
    workflow_call:
        inputs:
            draft:
                description: Create the release as a draft rather than publishing it
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    release:
        # Ubuntu: the plugin is one JavaScript bundle and the Elgato CLI that packs it is Node.
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Refuse anything but main
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "::error::A Stream Deck release is cut from main only, so its tag names a commit main has."
                  exit 1

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The same gates the ordinary build runs. Called from `release.yml` they have run already,
            # and run again here in a minute; run by hand, nothing else would have run them.
            - name: Build
              run: pnpm exec turbo run build --filter='@deadair/streamdeck...'

            - name: Test
              run: pnpm --filter @deadair/streamdeck test

            # The version is NOT an input, for the desktop release's reason: it is decided in a
            # changeset, which bumps `apps/streamdeck/package.json`, and `pnpm release:version` copies it
            # into the manifest's four-part `Version`. The check fails when the two disagree, and the
            # manifest is what the installer and the Stream Deck app report.
            - name: Read the version
              id: version
              run: |
                  set -euo pipefail
                  pnpm release:version --check
                  version="$(node -p "require('./apps/streamdeck/package.json').version")"
                  test -n "$version"
                  echo "value=${version}" >> "$GITHUB_OUTPUT"

            # Pack validates first, and refuses to pack a plugin that does not validate. The package's
            # script packs a COPY of the plugin folder, because the CLI rewrites the manifest it packs
            # in its own formatting, and a local pack should not leave the tree dirty. It is called
            # `installer` because `pnpm pack` is pnpm's own tarball command and wins over a script.
            - name: Pack the installer
              run: pnpm --filter @deadair/streamdeck run installer

            # The notes are this version's entry in `apps/streamdeck/CHANGELOG.md`, cut out with the same
            # awk `release.yml` uses on the station's, written by `pnpm release:version` from the
            # changesets that named `@deadair/streamdeck`. A version with no entry fails here rather than
            # publishing an installer with nothing said about it.
            - name: Take the notes out of the changelog
              env:
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  set -euo pipefail
                  awk -v v="## [${VERSION}]" '
                      index($0, v) == 1 { found = 1; next }
                      found && /^## \[/ { exit }
                      found && /^\[[^]]+\]: / { exit }
                      found { print }
                  ' apps/streamdeck/CHANGELOG.md > notes.md
                  if ! grep -q '[^[:space:]]' notes.md; then
                      echo "::error::apps/streamdeck/CHANGELOG.md has no entry for ${VERSION}. Write a changeset naming @deadair/streamdeck."
                      exit 1
                  fi
                  cat >> notes.md <<'NOTES'

                  To install, download `radio.deadair.streamdeck.streamDeckPlugin` and open it: the Stream
                  Deck app (7.1 or later) installs it. Then open any deadair key's settings and enter the
                  station's address and an API key, issued in the console under Settings, Security, API
                  keys, with Read and manage.
                  NOTES
                  cat notes.md

            # The station's `publish` job's arrangement, and for its reason: GitHub refuses the workflow
            # token a tag on a commit main has moved past with a workflow change, which is how the
            # station's 0.2.0 went out from the wrong run. A job-level `if` cannot read a secret, so
            # whether the App is configured is a step's output.
            - name: Look for the release App
              id: app
              env:
                  CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
              run: |
                  if [ -n "${CLIENT_ID}" ] && [ -n "${PRIVATE_KEY}" ]; then
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::warning::The release App is not configured (RELEASE_APP_CLIENT_ID, RELEASE_APP_PRIVATE_KEY), so this publishes with the workflow token, which GitHub refuses if main has moved on with a workflow change."
                      echo "present=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Mint the App token
              id: token
              if: steps.app.outputs.present == 'true'
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-workflows: write

            # The tag first, and the release on it with `--verify-tag`, so the release can only ever
            # name the tag this step made on this commit. As in `publish`: a tag this step made is
            # deleted again if the release cannot be created, because `release.yml` reads "there is a
            # tag" as "this version went out" and would never retry; and a release that already exists
            # is success, so re-running a run that got this far stays green.
            - name: Tag it, then publish it
              env:
                  GH_TOKEN: ${{ steps.token.outputs.token || github.token }}
                  VERSION: ${{ steps.version.outputs.value }}
                  DRAFT: ${{ inputs.draft }}
              run: |
                  set -euo pipefail
                  tag="streamdeck-v${VERSION}"

                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "${tag} is already released."
                      exit 0
                  fi

                  existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" --jq ".[] | select(.ref == \"refs/tags/${tag}\") | .object.sha")"
                  made=false
                  if [ -z "$existing" ]; then
                      if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" > /dev/null; then
                          echo "::error::Could not create ${tag}. If this is a 403 and the release App is not configured, see \"Releasing\" in docs/internals/deployment.md; the next push to main releases ${VERSION} either way."
                          exit 1
                      fi
                      made=true
                  elif [ "$existing" != "$GITHUB_SHA" ]; then
                      echo "::error::${tag} already points at ${existing}, not ${GITHUB_SHA}, and has no release. Delete the tag if nothing shipped from it, and the next push to main releases ${VERSION}."
                      exit 1
                  fi

                  draft=()
                  if [ "$DRAFT" = true ]; then draft=(--draft); fi
                  if ! gh release create "$tag" --verify-tag "${draft[@]}" \
                      --title "deadair for Stream Deck ${VERSION}" \
                      --notes-file notes.md \
                      "apps/streamdeck/artifacts/radio.deadair.streamdeck.streamDeckPlugin"; then
                      if [ "$made" = true ]; then
                          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" ||
                              echo "::error::Could not delete ${tag} after the release failed. Delete it by hand, or no later push will retry ${VERSION}."
                      fi
                      exit 1
                  fi
